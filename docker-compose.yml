services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      AGENTFLOW_REPO_ROOT: /repo
      AGENTFLOW_UPLOADS_DIR: /repo/uploads
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/agentflow
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      CHATZOC_API_KEY: ${CHATZOC_API_KEY:-}
      CHATZOC_BASE_URL: ${CHATZOC_BASE_URL:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8001:8000"
    volumes:
      - ./skills:/repo/skills
      - ./config:/repo/config
      - ./static:/repo/static
      - ./uploads:/repo/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "3000:3000"

  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A app.celery_app worker --loglevel=info
    environment:
      AGENTFLOW_REPO_ROOT: /repo
      AGENTFLOW_UPLOADS_DIR: /repo/uploads
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/agentflow
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      CHATZOC_API_KEY: ${CHATZOC_API_KEY:-}
      CHATZOC_BASE_URL: ${CHATZOC_BASE_URL:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./skills:/repo/skills
      - ./config:/repo/config
      - ./static:/repo/static
      - ./uploads:/repo/uploads

volumes:
  postgres_data:
