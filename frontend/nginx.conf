# AgentFlow 前端 nginx 配置。
#
# 前端构建产物是纯静态文件，浏览器里所有 /api、/static、/ws 请求都从这里
# 反代到后端容器 —— 所以**同源**，生产环境不依赖 CORS（后端的 CORS 配置
# 只服务于本地开发那种 5173 → 8001 的跨端口场景）。
#
# 后端服务名 backend 来自 docker-compose 的 service 名，由 Docker 内置 DNS 解析。

server {
    listen 3000;
    # 用 _ 而不是 localhost：部署在服务器上时 Host 头是域名或 IP，
    # 写死 localhost 会让 nginx 落到默认 server 块上，表现为「接口 404」。
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 后端允许的技能包上限是 256MB（app/services/skill_package.py 的
    # MAX_ZIP_BYTES），知识库单文件上限 50MB。这里必须不小于前者，
    # 否则传大技能包会被 nginx 挡在门外，而错误页是 nginx 自己的 413，
    # 看起来像是「上传功能坏了」。
    client_max_body_size 300m;

    # 大文件上传慢，默认 60s 的读超时会中途掐断
    client_body_timeout 300s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/xml
        image/svg+xml;

    # 带内容哈希的构建产物可以长期缓存；index.html 绝不能缓存，
    # 否则发新版后浏览器还在用旧的 index 去引用已删掉的 chunk，白屏。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 对话接口是 StreamingResponse（SSE）。nginx 默认会缓冲上游响应，
        # 缓冲之后「逐字吐字」会变成等全部生成完一次性返回 —— 界面看起来
        # 就是卡住不动然后突然出全文。
        proxy_buffering off;
        proxy_cache off;

        # 大模型生成慢，60s 默认读超时会掐断长回答
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 30s;
    }

    # 技能产物（Excel/PDF/PPT 下载）与头像
    location /static {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 产物文件可能不小，下载也别被 60s 掐断
        proxy_read_timeout 600s;
    }

    location /ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket 是长连接，默认 60s 无数据就断开
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
