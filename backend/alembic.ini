# Alembic configuration
#
# NOTE: keep this file ASCII-only. Alembic reads alembic.ini with the system
# locale encoding (GBK on zh-CN Windows), so non-ASCII comments break it.
#
# The database URL is intentionally NOT set here. migrations/env.py reads it
# from app.core.config.settings.DATABASE_URL (i.e. the same .env as the app),
# so the two can never drift apart.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Timestamped revision filenames for stable ordering
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
