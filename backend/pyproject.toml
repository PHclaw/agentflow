# ruff 规则集显式声明：不依赖工具版本的默认值演进。
# 新版 ruff 的默认选择已经扩到 UP/B/BLE/S 等，跑出来 700+ 条历史遗留告警，
# 直接让 CI 变红。这里固定为「语法错误 + 未使用 + 导入顺序」这一档，
# 先保证 CI 有意义，之后再按需逐条放开。
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
# E402：部分模块需要先设置环境变量 / 注册路由再 import，属有意为之
ignore = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["app"]
omit = ["app/tests/*", "app/*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
