name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]
  # 允许在 Actions 页面或通过 gh workflow run 手动触发：
  # 排查「推送后没有触发流水线」这类问题时，需要一个不依赖 push 事件的入口。
  workflow_dispatch:

jobs:
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with ruff
        run: |
          ruff check app/ --output-format=github

      - name: Run tests
        run: |
          python -m pytest tests/ -v --timeout=30 -x

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          # 锁文件在 frontend/ 下，不指定路径时 setup-node 会去仓库根找，
          # 报 "Dependencies lock file is not found" 并直接失败
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
