<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="AgentFlow — 拖拽式构建 AI Agent 工作流">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1226"/>
      <stop offset="0.55" stop-color="#101E42"/>
      <stop offset="1" stop-color="#0E2A3E"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00D9C0"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D9C0" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#00D9C0" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#00D9C0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00D9C0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <!-- 右上角：工作流节点母题，呼应产品的拖拽画布 -->
  <g opacity="0.9">
    <path d="M880 96 L1000 96" stroke="url(#line)" stroke-width="2"/>
    <path d="M1000 96 L1120 150" stroke="url(#line)" stroke-width="2"/>
    <path d="M1000 96 L1120 42" stroke="url(#line)" stroke-width="2"/>
    <path d="M880 96 L880 210" stroke="url(#line)" stroke-width="2"/>
    <path d="M880 210 L1120 210" stroke="url(#line)" stroke-width="2"/>

    <rect x="838" y="74" width="84" height="44" rx="10" fill="#13224A" stroke="#00D9C0" stroke-opacity="0.5"/>
    <rect x="962" y="74" width="84" height="44" rx="10" fill="#13224A" stroke="#00D9C0" stroke-opacity="0.35"/>
    <rect x="1086" y="128" width="84" height="44" rx="10" fill="#13224A" stroke="#3B82F6" stroke-opacity="0.45"/>
    <rect x="1086" y="20" width="84" height="44" rx="10" fill="#13224A" stroke="#3B82F6" stroke-opacity="0.45"/>
    <rect x="838" y="188" width="84" height="44" rx="10" fill="#13224A" stroke="#00D9C0" stroke-opacity="0.3"/>
    <rect x="1078" y="188" width="92" height="44" rx="10" fill="#13224A" stroke="#00D9C0" stroke-opacity="0.55"/>

    <circle cx="880" cy="96" r="4" fill="#00D9C0"/>
    <circle cx="1000" cy="96" r="4" fill="#00D9C0"/>
    <circle cx="880" cy="210" r="4" fill="#3B82F6"/>
  </g>

  <!-- 左侧：标识与标题 -->
  <g transform="translate(84, 92)">
    <rect x="0" y="0" width="72" height="72" rx="20" fill="url(#mark)"/>
    <path d="M22 52 L36 20 L50 52 M28.5 41 H43.5"
          fill="none" stroke="#0B1226" stroke-width="6"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="184" y="130" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif"
        font-size="58" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">AgentFlow</text>

  <text x="186" y="170" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif"
        font-size="21" fill="#9FB3CE" letter-spacing="0.3">拖拽式构建 AI Agent 工作流</text>

  <text x="186" y="228" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif"
        font-size="15" fill="#6E82A0" letter-spacing="0.4">无需一行代码  ·  多模型支持  ·  知识库 RAG  ·  5 分钟上线</text>

  <rect x="0" y="0" width="6" height="320" fill="url(#mark)"/>
  <rect x="84" y="252" width="76" height="3" rx="1.5" fill="#00D9C0" opacity="0.85"/>
</svg>
